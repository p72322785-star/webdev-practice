<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positions</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
            margin:30px;
            background-color: rgb(255, 204, 0);
            position: realtive;
            padding: 20px;
        }
        #box1 {
            position: sticky;
            top:0;
            z-index: 1;
            background-color: rgb(0, 255, 0);
        }
        #box2 {
            position: relative;
            right:0;
            
        }
        #box3 {
            position: absolute;
            top: 50;
            }
        #box4 {
            position: fixed;
            bottom: 0;
         }
    </style>
</head>
<body>
    
    <div class="parent">
        <div id="box1" class="box">I am static</div>
        <div id="box2" class="box">I am realtive</div>
        <div id="box3" class="box">I am absolute</div>
        <div id="box4" class="box">I am fixed</div>
    </div>
    
</body>
</html>
