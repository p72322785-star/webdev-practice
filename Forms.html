<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="./index.css">
</head>
<body>

    <h1>Student Registration Portal</h1>
    
    <form action="/register" method="post" class="form-container">

        <p>
        <label for="fullname"><b>Full Name:</b></label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter name" required><br>
        </p>

        <p>
        <label for="email"><b>University Email:</b></label><br>
        <input type="email" id="email" name="email" placeholder="Enter email" required><br>
        </p>

        <p>
        <label for="age"><b>Age:</b></label><br>
        <input type="number" id="age" name="age" placeholder="Enter age"><br>
        </p>

        <p>
        <label for="dob"><b>Date of Birth:</b></label><br>
        <input type="date" id="dob" name="dateofbirth" placeholder="Enter date of birth"><br>
        </p>

        <p>
        <label for="gender"><b>Gender:</b></label>
        <label for="male">Male</label>
        <input type="radio" value="male" name="gender" id="male">
        <label for="female">Female</label>
        <input type="radio" value="female" name="gender" id="female"> 
        </p><br

        <p> 
        <label for="skills"><b>Skills:</b></label>
        <br>

        <input type="checkbox" id="" name="" value="">
        <label for="java">Java</label>
        <input type="checkbox" id="" name="" value="">
        <label for="python">python</label>
        <input type="checkbox" id="" name="" value="">
        <label for="js">JavaScript</label>
        </p>
        <br>

        <p>
        <label for="course"><b>Course:</b></label>
        <select name="course" id="course" placeholder="Select course"><br>
            <option value="cs">Computer Science</option>
            <option value="it">Information Technology</option>
            <option value="ec">Electronics and Communication</option>
            <option value="me">Mechanical</option>
        </select><br>
        </p>

        <p>
        <button type="submit">Submit</button>
        </p>  
    </form>
            <label for="location">Location:</label>
        <iframe height="50" width="50"src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d28284.513007672955!2d77.60117759999999!3d27.60704!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1787139398098!5m2!1sen!2sin"></iframe>
</body>
</html>
