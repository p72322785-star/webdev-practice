<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Portal</h1>
    
    <form action="/register" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter name" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter email" required><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter age"><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dateofbirth" placeholder="Enter date of birth"><br>

        <label for="gender">Gender:</label>
        <label for="male">Male</label>
        <input type="radio" value="male" name="gender" id="male">
        <label for="female">Female</label>
        <input type="radio" value="female" name="gender" id="female"> <br>

        <label for="skills">Skills:</label><br>
        <input type="checkbox" id="" name="" value="">
        <label for="java">Java</label><br>
        <input type="checkbox" id="" name="" value="">
        <label for="python">python</label><br>
        <input type="checkbox" id="" name="" value="">
        <label for="js">JavaScript</label><br>

        <button type="submit">Submit</button>
        

    </form>
</body>
</html>
