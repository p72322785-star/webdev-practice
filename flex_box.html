<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box-container{
            background-color: rgb(231, 189, 140);
            display: flex;
            justify-content:center;
            align-items:center;
            gap:30px;
            height:600px;
            flex-direction: column;
            
        }
        .box{
            background-color: rgb(202, 105, 169);
            height:200px;
            width:200px;
            display: flex;
            justify-content: center;
            align-items: center;

         }
         .lower-box{
            background-color: blueviolet;
            height:200px;
            width:300px;
            display: flex;
         }
    </style>
</head>
<body>
    <div class="box-container">
        <div class="box"><h1>box-1</h1></div>
        <div class="box"><h1>box-2</h1></div>
        <div class="box"><h1>box-3</h1></div>
        <div class="box"><h1>box-4</h1></div>

    </div>
    
</body>
</html>
