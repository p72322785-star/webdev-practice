    <style>
            .cards-container{
            max-width: 800px;
            background-color:rgb(238, 239, 240);
            font-family:sans-serif;
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:50px;
            justify-items: center;
            margin:0 auto;
           }
        .movie-card{
            width:200px;
            border: 1px solid;
            border-color:#e5e7eb;
            background-color:rgb(243, 243, 243);
            border-radius:16px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            transition:all 0.2s; 
            animation:Cardanimation 0.6s ease ;
            
        }
        
        .movie-card:hover{
            box-shadow: 10px 10px 10px 10px  rgb(27, 40, 5);
            transform:scaleY(1.1);
        }
        .movie-image img{
            width:100%;
            height:auto;
            object-fit:cover;
            display:flex;
            flex-direction: row;
        }
        .movie-title{
            font-weight:600;

        }
        .movie-info{
            padding:8px;
        }
        .movie-detail{
            color:gray;
        }
        .button:hover{
            color:aqua;
            background-color: rgb(162, 94, 3);
        }
        .button{
            text-align:center;
            font-family:sans-serif;
            margin:20px 0px;
            border-radius: 10px;
            background-color: black;
            color:aliceblue;
            height:50px;
            width:100px;
            border:1px;
        }
        .headbutton{
            text-align:right;

        }
        @keyframes animate{
            from{
                opacity: 1;
                transform: rotateX('angle');

            }
            to{
                transform:rotateX('angle');
            }
        }
        @keyframes Cardanimation {
            from{
                opacity: 0;
                transform:translateY(30px);  /*positive upward ,negative downward*/

            }
            to{
                opacity: 1;
                transform:translateY(0px);
            }

        }
        .movie-card:nth-child(1){
            animation-delay:0.1s;
        }
         .movie-card:nth-child(2){
            animation-delay:0.2s;;
        }
         .movie-card:nth-child(3){
            animation-delay:0.3s;
        }
        


    </style>
</head>
